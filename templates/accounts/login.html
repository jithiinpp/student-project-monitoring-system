{% extends "base.html" %}

{% block title %}
SPMS | Login
{% endblock %}


{% block extra_css %}

<style>

    /* ==============================
       LOGIN PAGE
    ============================== */

    .auth-page {
        min-height: calc(100vh - 70px);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px 20px;

        background: #edf2f9;
    }


    /* ==============================
       LOGIN CARD
    ============================== */

    .auth-card {

        width: 100%;
        max-width: 450px;

        background: #ffffff;

        padding: 40px;

        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(0, 0, 0, 0.08);

        text-align: center;
    }


    /* ==============================
       LOGO
    ============================== */

    .auth-logo {

        width: 66px;
        height: 66px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #4f5bd5;

        color: #ffffff;

        border-radius: 15px;

        font-size: 20px;
        font-weight: 700;

        letter-spacing: 0.5px;
    }


    /* ==============================
       HEADING
    ============================== */

    .auth-card h1 {

        margin: 0;

        font-size: 30px;

        color: #111827;

        font-weight: 700;
    }


    .auth-subtitle {

        margin: 10px 0 30px;

        color: #64748b;

        font-size: 15px;
    }


    /* ==============================
       FORM
    ============================== */

    .auth-form {

        text-align: left;
    }


    .form-group {

        margin-bottom: 20px;
    }


    .form-group label {

        display: block;

        margin-bottom: 8px;

        color: #334155;

        font-size: 14px;

        font-weight: 600;
    }


    .form-group input {

        width: 100%;

        box-sizing: border-box;

        padding: 13px 14px;

        border: 1px solid #d1d5db;

        border-radius: 9px;

        background: #ffffff;

        color: #111827;

        font-size: 14px;

        outline: none;

        transition: 0.2s ease;
    }


    .form-group input::placeholder {

        color: #94a3b8;
    }


    .form-group input:focus {

        border-color: #6366f1;

        box-shadow:
            0 0 0 3px rgba(99, 102, 241, 0.14);
    }


    /* ==============================
       LOGIN BUTTON
    ============================== */

    .auth-button {

        width: 100%;

        padding: 13px 18px;

        border: none;

        border-radius: 9px;

        background: #4f5bd5;

        color: #ffffff;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s ease;
    }


    .auth-button:hover {

        background: #34358f;

        transform: translateY(-1px);
    }


    .auth-button:active {

        transform: translateY(0);
    }


    /* ==============================
       FOOTER
    ============================== */

    .auth-footer {

        margin-top: 25px;

        text-align: center;
    }


    .auth-footer p {

        margin: 0 0 8px;

        color: #64748b;

        font-size: 14px;
    }


    .auth-footer a {

        color: #4f5bd5;

        font-size: 14px;

        font-weight: 600;

        text-decoration: none;
    }


    .auth-footer a:hover {

        text-decoration: underline;
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

        .auth-page {

            padding: 25px 15px;
        }


        .auth-card {

            padding: 30px 22px;

            border-radius: 14px;
        }


        .auth-card h1 {

            font-size: 26px;
        }


    }

</style>

{% endblock %}


{% block content %}


<!-- =================================
     LOGIN PAGE
================================= -->

<div class="auth-page">

    <div class="auth-card">


        <!-- LOGO -->

        <div class="auth-logo">
            SPMS
        </div>


        <!-- TITLE -->

        <h1>
            Welcome Back
        </h1>


        <p class="auth-subtitle">
            Student Project Monitoring System
        </p>


        <!-- LOGIN FORM -->

        <form
            method="POST"
            class="auth-form"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <div class="auth-footer">

            <p>
                Don't have a student account?
            </p>

            <a href="{% url 'accounts:register' %}">
                Register as Student
            </a>

        </div>

    </div>

</div>



{% endblock %}

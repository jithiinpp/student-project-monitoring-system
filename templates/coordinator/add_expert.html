{% extends "base.html" %}

{% block title %}
Add Domain Expert | SPMS
{% endblock %}

{% block extra_css %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        
        <div class="form-header">
            <div class="form-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a6 6 0 0 1 12 0v2"></path><path d="M19 8v6"></path><path d="M16 11h6"></path></svg>
            </div>
            <div class="form-title-wrapper">
                <h1>Add Domain Expert</h1>
                <p>Create a new account for a Domain Expert</p>
            </div>
        </div>

        <form method="POST" action="{% url 'coordinator:add_expert' %}">
            {% csrf_token %}

            <div class="form-grid">
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="Set a secure password" required>
                </div>

                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" placeholder="First name">
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Last name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                </div>

                <div class="form-group full">
                    <label for="domain_of_expertise">Domain of Expertise *</label>
                    <input type="text" id="domain_of_expertise" name="domain_of_expertise" placeholder="E.g. Artificial Intelligence, Web Development" required>
                </div>

                <div class="form-group full">
                    <label>Additional Roles (Optional)</label>
                    <div style="display: flex; gap: 20px; margin-top: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="is_guide" value="True" style="width: auto; margin: 0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="vertical-align: text-bottom; margin-right: 6px;" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg> Also make this user a Guide
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="is_panel" value="True" style="width: auto; margin: 0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="vertical-align: text-bottom; margin-right: 6px;" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Also make this user a Panel Member
                        </label>
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <a href="{% url 'coordinator:experts' %}" class="btn btn-back">
                    <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Experts List
                </a>
                
                <button type="submit" class="btn btn-submit">
                    <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Create Expert Account
                </button>
            </div>
            
        </form>
    </div>
</div>
{% endblock %}

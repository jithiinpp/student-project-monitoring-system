{% load static %}
<link rel="stylesheet" href="{% static 'css/student_layout.css' %}?v=5">

<aside class="spms-sidebar">
    <div class="sidebar-brand">
        <div class="brand-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="vertical-align: text-bottom;" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div>
        <div>
            <h2>SPMS</h2>
            <span>Student Portal</span>
        </div>
    </div>
    
    <nav class="sidebar-nav">
        <a href="{% url 'accounts:student_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'accounts:student_proposals' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_proposals' or request.resolver_match.url_name == 'student_proposal_detail' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path><path d="M3 9h18"></path></svg></span>
            <span>My Proposals</span>
        </a>
        <a href="{% url 'accounts:add_proposal' %}" class="sidebar-link {% if request.resolver_match.url_name == 'add_proposal' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v5"></path><path d="M14 3v5h5"></path><path d="M6 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6"></path><path d="M16 15v6"></path><path d="M13 18h6"></path></svg></span>
            <span>Submit Proposal</span>
        </a>
        <a href="{% url 'accounts:student_weekly_reports' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_weekly_reports' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M14 3v5h5"></path><path d="M8 13h8"></path><path d="M8 17h6"></path></svg></span>
            <span>Weekly Reports</span>
        </a>
        <a href="{% url 'accounts:student_final_reports' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_final_reports' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></span>
            <span>Final Reports</span>
        </a>
        <a href="{% url 'accounts:student_discussion' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_discussion' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></span>
            <span>Discussion</span>
        </a>
        <a href="{% url 'accounts:student_schedule' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_schedule' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
            <span>Scheduled Review</span>
        </a>
        <a href="{% url 'accounts:student_final_mark' %}" class="sidebar-link {% if request.resolver_match.url_name == 'student_final_mark' %}active{% endif %}">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"></circle><path d="M9 12.5L8 21l4-2 4 2-1-8.5"></path><path d="M12 5.5l.8 1.6 1.7.2-1.2 1.2.3 1.7-1.6-.8-1.6.8.3-1.7-1.2-1.2 1.7-.2z"></path></svg></span>
            <span>Final Mark</span>
        </a>
    </nav>
    
    <div class="sidebar-bottom">
        <div class="student-mini-profile">
            <div class="profile-avatar">
                {{ request.user.username|first|upper }}
            </div>
            <div class="profile-info">
                <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
                <span>Student</span>
            </div>
        </div>
        <a href="{% url 'accounts:logout' %}" class="sidebar-logout">
            <span class="logout-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
            <span>Sign Out</span>
        </a>
    </div>
</aside>

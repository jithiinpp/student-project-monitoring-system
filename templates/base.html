{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            SPMS
        {% endblock %}
    </title>


    <!-- =====================================================
         MAIN CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- =====================================================
         PAGE-SPECIFIC CSS
         ===================================================== -->

    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- =====================================================
         DJANGO MESSAGES
         ===================================================== -->

    {% if messages %}

        <div class="messages-container">

            {% for message in messages %}

                <div class="message {{ message.tags }}">

                    {{ message }}

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- =====================================================
         SIDEBAR
         
         Pages that use the common sidebar can override this
         block.
         ===================================================== -->

    {% block sidebar %}
    {% endblock %}


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- =====================================================
         PAGE-SPECIFIC JAVASCRIPT
         ===================================================== -->

    {% block extra_js %}
    {% endblock %}


</body>

</html>
